# 标的 -> Kraken 现货交易对（altname）。
# CDE 永续不用配：按标的（contract_root_unit）从公开合约列表里自动找，
# 合约代码带到期日（BIP-20DEC30-CDE），写死了哪天换代就悄悄失效。
[symbols]
BTC = "XBTUSD"
ETH = "ETHUSD"
SOL = "SOLUSD"
AVAX = "AVAXUSD"
LTC = "LTCUSD"
LINK = "LINKUSD"
XRP = "XRPUSD"
DOGE = "XDGUSD"
ZEC = "ZECUSD"

# 费率按小数写（0.004 = 0.40%）。
# Kraken Pro 最低档：maker 0.25% / taker 0.40%（成交量上去会降）。
# Coinbase 按账户档位（transaction_summary 接口），2026-10-01 是 Advanced 2：
#   现货 maker 0.15% / taker 0.30%
#   CDE  maker 0.055% / taker 0.07%，【另加每张 $0.12】（交易所/清算/NFA 固定费）
# 每张 $0.12 是拿 91 笔真实成交倒推的：扣掉档位比例后每笔都正好剩 $0.12/张，
# 误差 < 1%。固定费让小合约吃亏 —— AVAX 一张 $109，实际费率 0.165%。
# 档位随 30 天成交量变，升降档后改这里。
[fees]
kraken_taker = 0.0040
kraken_maker = 0.0025
coinbase_taker = 0.0030
coinbase_maker = 0.0015
# Coinbase One：Advanced【现货】手续费返还 25%，USDC 入账、几分钟到账、无月度上限
# （2026-10-01 流水 subscription_rebate 逐笔核对 = 手续费 × 0.25000）。
# CDE 合约手续费没有返利（227 笔成交无负手续费、流水无对应类型）
coinbase_rebate = 0.25
cde_taker = 0.0007
cde_maker = 0.00055
cde_per_contract = 0.12

[risk]
# 任一腿的成交均价偏离中间价超过这么多基点，整笔不做（两腿都不下）
max_slippage_bps = 30
# 实盘对齐检查：|现货数量 - 空单数量| / 现货数量 超过这个就标红
hedge_tolerance = 0.02
# market / paper open 不指定 --usd 时的单腿规模
default_usd = 5000
# 「现货多出空单的部分」是有意持有的标的：
#   没开空单（PAXG、DOGE）→ 显示「有意持有」
#   开了空单（BTC）→ 对冲部分照常检查，多出的现货不标红、不给调整建议；
#   但空单反而多于现货（净空）仍然标红 —— 那不是「持有」能解释的
hold_only = ["PAXG", "DOGE", "BTC"]

[live]
# 单次开/平仓的名义金额上限（美元）。超过就拒绝，防止手滑多打一个 0
max_notional_usd = 25000
# 现货挂单多久还没全部成交，就改用吃单补齐（秒）
max_wait_s = 600
# 被别人抢到前面后，最快多久撤单重挂（秒）—— 太勤会撞 API 限频
reprice_min_s = 4
# 轮询订单状态的间隔（秒）
poll_s = 2
# 现货每块最多挂多少美元（至少一张合约的量）。整块被一口吃掉时没对冲的也只有这一块
clip_usd = 2000
# 吃单限价逐档放宽（基点）：空单跟进、超时补齐、回滚都用这套。用完后按市价。
# 空单跟进【只升级不放弃】—— 暴跌时放弃对冲就是在最坏的时刻留下裸腿
hedge_escalation_bps = [30, 100, 300]

[watch]
# 净敞口小于这么多美元的「没对齐」不报警（整张取整剩下的零头）
min_alert_usd = 200
# 连续几轮取数失败才报「监控看不见」（15 分钟一轮，3 轮 = 45 分钟）
blind_after = 3
# 同一个问题持续存在时的重发间隔（小时），用完最后一档就一直按它
resend_hours = [1, 3, 6, 12, 24]
