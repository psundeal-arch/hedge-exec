# 标的 -> Kraken 现货交易对（altname）。
# CDE 永续不用配：按标的（contract_root_unit）从公开合约列表里自动找，
# 合约代码带到期日（BIP-20DEC30-CDE），写死了哪天换代就悄悄失效。
[symbols]
BTC = "XBTUSD"
ETH = "ETHUSD"
SOL = "SOLUSD"
AVAX = "AVAXUSD"
LTC = "LTCUSD"
LINK = "LINKUSD"
XRP = "XRPUSD"
DOGE = "XDGUSD"
ZEC = "ZECUSD"
HBAR = "HBARUSD"
SUI = "SUIUSD"
ONDO = "ONDOUSD"

# 费率按小数写（0.004 = 0.40%）。
# Kraken Pro 最低档：maker 0.25% / taker 0.40%（成交量上去会降）。
# Coinbase 按账户档位（transaction_summary 接口），2026-10-01 是 Advanced 2：
#   现货 maker 0.15% / taker 0.30%
#   CDE  maker 0.055% / taker 0.07%，【另加每张 $0.12】（交易所/清算/NFA 固定费）
# 每张 $0.12 是拿 91 笔真实成交倒推的：扣掉档位比例后每笔都正好剩 $0.12/张，
# 误差 < 1%。固定费让小合约吃亏 —— AVAX 一张 $109，实际费率 0.165%。
# 档位随 30 天成交量变，升降档后改这里。
[fees]
# 2026-10-10 TradeVolume 接口实测（30 天量 $1,306，最低档）：挂单 0.40% / 吃单 0.80%。
# 原来写的 0.25% / 0.40% 是旧费率表 —— 当天 AVAX 20 枚 post-only 成交实收 0.40%。
# 30 天量到 $2,500 降为 0.30% / 0.60%；量变了用 /0/private/TradeVolume 重抓
kraken_taker = 0.0080
kraken_maker = 0.0040
coinbase_taker = 0.0030
coinbase_maker = 0.0015
cde_taker = 0.0007
cde_maker = 0.00055
cde_per_contract = 0.12

[risk]
# 【只作用于 hedge paper open/close（executor.run_pair）】：任一腿的成交均价偏离中间价超过这么多
# 基点，整笔不做。实盘（hedge live / exec，ladder.py）不读它 —— 实盘空单跟进按 [live]
# hedge_escalation_bps 逐档放宽、最后市价，现货腿的价格保护是 exec --limit（审查 H10）
max_slippage_bps = 30
# 实盘对齐检查：|现货数量 - 空单数量| / 现货数量 超过这个就标红
hedge_tolerance = 0.02
# market / paper open 不指定 --usd 时的单腿规模
default_usd = 5000
# 「现货多出空单的部分」是有意持有的标的：
#   没开空单（PAXG、DOGE）→ 显示「有意持有」
#   开了空单（BTC）→ 对冲部分照常检查，多出的现货不标红、不给调整建议；
#   但空单反而多于现货（净空）仍然标红 —— 那不是「持有」能解释的
hold_only = ["PAXG", "DOGE", "BTC", "ETH"]
# CDE 永续由 perp-grid 实盘网格独立交易（2026-10-03 起 SUI；10-04 加 XRP，服务器上已先改）：仓位不和现货对齐、watch 不报警。
# 这些标的不要再用 hedge live 开对冲空单 —— 会和网格的仓位混在一起。
grid_only = ["SUI", "XRP", "ADA"]

[live]
# 单次开/平仓的名义金额上限（美元）。超过就拒绝，防止手滑多打一个 0
max_notional_usd = 25000
# 现货挂单多久还没全部成交，就改用吃单补齐（秒）
max_wait_s = 600
# 被别人抢到前面后，最快多久撤单重挂（秒）—— 太勤会撞 API 限频
reprice_min_s = 4
# 轮询订单状态的间隔（秒）
poll_s = 2
# 现货每块最多挂多少美元（至少一张合约的量）。整块被一口吃掉时没对冲的也只有这一块
clip_usd = 2000
# 吃单限价逐档放宽（基点）：空单跟进、超时补齐、回滚都用这套。用完后按市价。
# 空单跟进【只升级不放弃】—— 暴跌时放弃对冲就是在最坏的时刻留下裸腿
hedge_escalation_bps = [30, 100, 300]
# CDE 每张 $0.12 固定费折成 bp/边 的上限 —— 超过就【拒绝开仓】（平仓永远放行）。
# 它决定的是最小可行规模：AVAX 一张 $109 → 光固定费 11bp/边，往返 22bp，比费率差还大。
# 5bp 拦下 SHIB(20) / AVAX(11) / DOT(10)；ETH(4.4) / ADA(4.5) 放行（2026-10-05 价格）
max_fixed_fee_bp = 5
# 容量按【自己的出场】算，不是按进场深度：scan 默认按这个金额走 CDE 卖盘算冲击、对 24h 成交额算参与率
exit_usd = 25000
# 出场时 CDE 吃单把卖盘吃到 VWAP 比中价贵多少 bp 以上算容量不够
max_exit_impact_bp = 30
# 出场额占 24h 成交额（现货、CDE 各自）的上限
max_adv_share = 0.01

[watch]
# 净敞口小于这么多美元的「没对齐」不报警（整张取整剩下的零头）
min_alert_usd = 200
# 连续几轮取数失败才报「监控看不见」（15 分钟一轮，3 轮 = 45 分钟）
blind_after = 3
# 同一个问题持续存在时的重发间隔（小时），用完最后一档就一直按它
resend_hours = [1, 3, 6, 12, 24]
# 本机应该读得到持仓的场所。缺凭据时：名单内 → 立即报「配置错误」（不是等 45 分钟报「看不见」，
# 等多久都不会自己好）；名单外 → 只记一条提示、不算失败（M4）
venues = ["kraken", "robinhood", "coinbase"]
# 解押 / 赎回到账提醒：「场所:币」的【可用】数量达到这个数就 Pushover 通知（不写场所 = robinhood），
# 之后按 resend_hours 退避提醒，直到从这里删掉。
#   robinhood:ETH  2026-10-11：已两腿平掉 19 张（卖 1.9），剩 26 张要卖 2.6 枚才能平
unstake_targets = { "robinhood:ETH" = 2.6 }
