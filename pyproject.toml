[project]
name = "hedge-bot"
version = "0.1.0"
description = "现货 + Coinbase CDE 永续空单的两腿对冲：开平仓、日内执行、对齐巡检（会下真实订单）"
requires-python = ">=3.11"
dependencies = [
    "requests",
    # CDP 的 API key 是 Ed25519，JWT 要 EdDSA 签名 —— 纯 pyjwt 不带这个后端
    "pyjwt[crypto]",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hedge = "hedgebot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
